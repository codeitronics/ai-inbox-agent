[project]
name = "ai-inbox-agent"
version = "2.0.0"
description = "An AI agent that triages an inbox, summarises each email, drafts replies from your past answers and waits for your approval before sending."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Avnish Yadav", email = "avnish@codeitronics.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "loguru>=0.7",
  "anthropic>=0.70",
  "openai>=1.60",
  "google-genai>=1.0",
]

[project.optional-dependencies]
# Real Gmail inbox + optional Google Sheets log.
gmail = [
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "gspread>=6.1",
]

[project.scripts]
inbox-agent = "inbox_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inbox_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
